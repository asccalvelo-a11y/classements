name: Collecte Strava
on:
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: collecte
jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collecte
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          PSEUDOS: ${{ secrets.PSEUDOS }}
          ADHERENTS: ${{ secrets.ADHERENTS }}
          NOMS_STRAVA: ${{ vars.NOMS_STRAVA }}
        run: python3 collecte.py
      - name: Enregistrement
        run: |
          git config user.name "collecte-asccal"
          git config user.email "actions@users.noreply.github.com"
          git add data/activities.json
          git diff --cached --quiet || git commit -m "Collecte automatique"
          git push
